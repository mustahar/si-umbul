name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Download and Install Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-7.5-bin.zip
        unzip gradle-7.5-bin.zip
        echo "include ':app'" > settings.gradle
        echo "rootProject.name='Si-Umbul'" >> settings.gradle

    - name: Build APK Release
      run: |
        export PATH=$PWD/gradle-7.5/bin:$PATH
        gradle assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Si-Umbul-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
